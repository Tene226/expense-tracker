# Config temporaire HTTP-only pour l'acquisition initiale du certificat Let's Encrypt.
# Remplacé par nginx.conf après "certbot certonly".
server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'initializing...';
        add_header Content-Type text/plain;
    }
}
